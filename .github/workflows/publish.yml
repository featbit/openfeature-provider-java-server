name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match pom.xml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check publishing credentials
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name. Grant this repository access to the organization secret."
              exit 1
            fi
          done

      - name: Set up Java and publishing credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: SIGNING_PASSWORD

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          requested = os.environ['RELEASE_VERSION']
          actual = ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version')
          if not re.fullmatch(r'\d+\.\d+\.\d+', requested) or requested != actual:
              raise SystemExit(f'Requested version {requested!r} must be a release version matching pom.xml ({actual}).')
          PY

      - name: Build, test, sign and publish
        run: mvn --batch-mode --no-transfer-progress clean deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
